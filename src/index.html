<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Compound Interest Calculator | CompoundCalc</title>
    <meta name="description" content="Calculate compound interest with recurring contributions. Explore investment growth over time with our free compound interest calculator." />
    <base href="/" />

    <!-- Google tag (gtag.js) - Deferred to idle to prevent blocking initial render & main thread -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-0ZHXNEDLNV');

      function loadAnalytics() {
        if (window.__gtagLoaded) return;
        window.__gtagLoaded = true;
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-0ZHXNEDLNV';
        document.head.appendChild(script);
      }

      if (typeof window !== 'undefined') {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadAnalytics, { timeout: 3500 });
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadAnalytics, 1500);
          });
        }
      }
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F6EF" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Google Fonts: Preconnect & Asynchronous Loading (Fraunces, DM Serif Display, Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=optional"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=optional"
      />
    </noscript>

    <!-- Early theme init to prevent flicker -->
    <script>
      try {
        const theme = localStorage.getItem('cc_theme') || 'system';
        const isDark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>

  <body
    class="bg-[#F8F6EF] text-[#202A23] dark:bg-[#141815] dark:text-[#EDE8DE] min-h-screen antialiased selection:bg-[#356B4A] selection:text-white transition-colors duration-200"
  >
    <app-root></app-root>
  </body>
</html>
