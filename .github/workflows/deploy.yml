name: Deploy Compound Calculator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions needed for deploying to gh-pages branch and GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Test & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --watch=false

      - name: Build Production Application (with base-href for GitHub Pages)
        run: npx ng build --base-href /compound-calculator/

      - name: Prepare Static Artifacts
        run: |
          # Copy index.html to 404.html so direct URL reloads route to Angular SPA
          cp dist/compound-calculator/browser/index.html dist/compound-calculator/browser/404.html
          # Create .nojekyll to prevent Jekyll from bypassing static asset folders
          touch dist/compound-calculator/browser/.nojekyll

      # Method 1: Deploy to gh-pages branch (Works with standard "Deploy from a branch" settings)
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/compound-calculator/browser
          clean: true

      # Method 2: Also upload and deploy via GitHub Actions Pages (if enabled in repo Settings -> Pages)
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist/compound-calculator/browser

  deploy-pages-action:
    name: Deploy to GitHub Pages (Actions Source)
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
