<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Exponential Growth Line Gradient -->
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Area Glow Under Curve -->
    <linearGradient id="areaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sparkle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6">
    <line x1="80" y1="380" x2="432" y2="380" />
    <line x1="80" y1="280" x2="432" y2="280" />
    <line x1="80" y1="180" x2="432" y2="180" />
  </g>

  <!-- Area Fill Under Compound Curve -->
  <path d="M 88 380 Q 240 376 330 260 T 416 112 L 416 380 Z" fill="url(#areaGlow)" />

  <!-- Compound Growth Curve -->
  <path d="M 88 380 Q 240 376 330 260 T 416 112" fill="none" stroke="url(#curveGrad)" stroke-width="36" stroke-linecap="round" />

  <!-- Compounding Nodes along the curve -->
  <circle cx="160" cy="372" r="14" fill="#10b981" />
  <circle cx="270" cy="336" r="16" fill="#06b6d4" />
  <circle cx="348" cy="232" r="18" fill="#6366f1" />

  <!-- Apex Arrowhead -->
  <polygon points="416,74 438,138 376,116" fill="#c084fc" filter="url(#glow)" />

  <!-- Peak Glowing Star / Sparkle of Wealth -->
  <g transform="translate(426, 92)" filter="url(#glow)">
    <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4" fill="#facc15" />
  </g>
</svg>
